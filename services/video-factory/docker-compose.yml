services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${VIDEO_FACTORY_PORT:-8080}:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      VIDEO_FACTORY_API_KEY: ${VIDEO_FACTORY_API_KEY:?Set VIDEO_FACTORY_API_KEY in .env}
      VIDEO_FACTORY_DATA_DIR: /data
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-157286400}
    volumes:
      - video_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    environment:
      REDIS_URL: redis://redis:6379/0
      VIDEO_FACTORY_DATA_DIR: /data
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-600}
    volumes:
      - video_data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  video_data:

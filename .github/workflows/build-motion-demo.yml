name: Build Motion Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Render 8-second vertical MP4 demo
        run: |
          ffmpeg -y -f lavfi -i "color=c=#07101f:s=720x1280:r=24:d=8" \
            -vf "drawgrid=w=48:h=48:t=1:c=0x456080@0.12,drawbox=x=60:y=90:w=600:h=80:color=white@0.06:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='BURST BRAIN CONCEPTS  /  CREATIVE LAB':fontcolor=0xb9d7ff:fontsize=21:x=85:y=120,drawbox=x='346+190*cos(t*0.8)':y='466+190*sin(t*0.8)':w=28:h=28:color=0x6edcff@0.9:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='IDEAS INTO':fontcolor=white:fontsize=68:x=70:y=780+20*sin(t*2):alpha='if(lt(t,0.7),0,(t-0.7))',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MOTION.':fontcolor=0x69cdff:fontsize=86:x=70:y=865+20*sin(t*2):alpha='if(lt(t,0.9),0,(t-0.9))',drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='A CPU-rendered motion design demo':fontcolor=0xbecde6:fontsize=25:x=74:y=985,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='NO PAID GPU  -  FFMPEG  -  MP4':fontcolor=0x91aacd:fontsize=20:x=70:y=1160" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart -crf 25 -preset veryfast -an \
            burst-brain-motion-demo.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 burst-brain-motion-demo.mp4
      - name: Publish downloadable video artifact
        uses: actions/upload-artifact@v4
        with:
          name: burst-brain-motion-demo
          path: burst-brain-motion-demo.mp4
          retention-days: 30
